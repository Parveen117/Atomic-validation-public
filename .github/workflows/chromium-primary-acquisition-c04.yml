name: C04 chromium primary acquisition packet

on:
  push:
    paths:
      - ".github/workflows/chromium-primary-acquisition-c04.yml"
      - "protocols/C04_CHROMIUM_PRIMARY_SCAN_ACQUISITION.json"
      - "scripts/run_chromium_primary_acquisition_c04.py"
      - "tests/test_chromium_primary_acquisition_c04.py"
      - "docs/CHROMIUM_PRIMARY_ACQUISITION_C04.md"
      - "docs/requests/C04_AUTHOR_DATA_REQUEST.md"
      - "docs/requests/C04_ARCHIVE_SCAN_REQUEST.md"
      - "docs/requests/C04_LIBRARY_REQUEST_METADATA.md"
      - "releases/chromium-neel-c04/chromium_primary_acquisition_certificate.json"
  pull_request:
    paths:
      - ".github/workflows/chromium-primary-acquisition-c04.yml"
      - "protocols/C04_CHROMIUM_PRIMARY_SCAN_ACQUISITION.json"
      - "scripts/run_chromium_primary_acquisition_c04.py"
      - "tests/test_chromium_primary_acquisition_c04.py"
      - "docs/CHROMIUM_PRIMARY_ACQUISITION_C04.md"
      - "docs/requests/C04_AUTHOR_DATA_REQUEST.md"
      - "docs/requests/C04_ARCHIVE_SCAN_REQUEST.md"
      - "docs/requests/C04_LIBRARY_REQUEST_METADATA.md"
      - "releases/chromium-neel-c04/chromium_primary_acquisition_certificate.json"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Run C04 tests
        run: python -m unittest tests.test_chromium_primary_acquisition_c04 -v
      - name: Reproduce C04 certificate
        run: |
          cp releases/chromium-neel-c04/chromium_primary_acquisition_certificate.json /tmp/C04.expected.json
          python scripts/run_chromium_primary_acquisition_c04.py
          python - <<'PY'
          import json
          from pathlib import Path

          expected = json.loads(Path('/tmp/C04.expected.json').read_text(encoding='utf-8'))
          actual = json.loads(
              Path('releases/chromium-neel-c04/chromium_primary_acquisition_certificate.json').read_text(
                  encoding='utf-8'
              )
          )
          assert actual == expected
          print('PASS_C04_SEMANTIC_CERTIFICATE_REPRODUCTION')
          PY
      - name: Upload C04 certificate and request packet
        uses: actions/upload-artifact@v4
        with:
          name: chromium-primary-acquisition-c04-python-${{ matrix.python-version }}
          path: |
            releases/chromium-neel-c04/chromium_primary_acquisition_certificate.json
            docs/requests/C04_AUTHOR_DATA_REQUEST.md
            docs/requests/C04_ARCHIVE_SCAN_REQUEST.md
            docs/requests/C04_LIBRARY_REQUEST_METADATA.md
          if-no-files-found: error
