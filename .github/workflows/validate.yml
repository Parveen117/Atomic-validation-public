name: Validate publication package

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Run unit tests
        run: python -m unittest discover -s tests -v

      - name: Certify exact RKF capstone core
        id: capstone
        continue-on-error: true
        run: python scripts/certify_rkf_capstone.py

      - name: Reproduce frozen UAM V4 release
        id: reproduce
        continue-on-error: true
        run: python scripts/reproduce_release.py

      - name: Run cross-fitted RKF nuclear prediction
        id: nuclear
        if: steps.reproduce.outcome == 'success'
        continue-on-error: true
        run: python scripts/run_rkf_nuclear_prediction.py

      - name: Build scientific fingerprint
        id: fingerprint
        if: steps.reproduce.outcome == 'success'
        continue-on-error: true
        run: python scripts/build_scientific_fingerprint.py

      - name: Build frozen publication bundle
        id: bundle
        if: steps.reproduce.outcome == 'success'
        run: python scripts/build_publication_bundle.py

      - name: Build reproducible paper analysis
        id: analysis
        if: steps.reproduce.outcome == 'success'
        run: python scripts/build_paper_analysis.py

      - name: Build conventional baseline comparison
        id: baselines
        if: steps.reproduce.outcome == 'success'
        run: python scripts/build_baseline_comparison.py

      - name: Upload capstone, nuclear prediction, reproduction, fingerprint, bundle, analysis and baseline artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: uam-v4-publication-package
          path: |
            releases/rkf-capstone-v5/exact_certificate.json
            releases/rkf-nuclear-v5/experiment_report.json
            releases/uam-v4/dataset_certificate.json
            releases/uam-v4/universal_atomic_guarded_two_axis_v4.json
            releases/uam-v4/reproduction_certificate.json
            releases/uam-v4/scientific_fingerprint.json
            releases/uam-v4/publication_bundle/
            releases/uam-v4/paper_analysis/
            releases/uam-v4/baseline_comparison/
          if-no-files-found: warn

      - name: Commit generated artifacts or diagnostics
        if: always() && github.event_name == 'push' && github.ref == 'refs/heads/main'
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          for path in \
            releases/rkf-capstone-v5/exact_certificate.json \
            releases/rkf-nuclear-v5/experiment_report.json \
            releases/uam-v4/dataset_certificate.json \
            releases/uam-v4/universal_atomic_guarded_two_axis_v4.json \
            releases/uam-v4/reproduction_certificate.json \
            releases/uam-v4/scientific_fingerprint.json \
            releases/uam-v4/publication_bundle \
            releases/uam-v4/paper_analysis \
            releases/uam-v4/baseline_comparison; do
            if [ -e "$path" ]; then
              git add "$path"
            fi
          done
          if git diff --cached --quiet; then
            echo "No generated artifact changes to commit."
          else
            git commit -m "Build reproducible UAM V4 and RKF nuclear prediction artifacts [skip ci]"
            git push
          fi

      - name: Enforce RKF capstone result
        if: steps.capstone.outcome != 'success'
        run: exit 1

      - name: Enforce reproduction result
        if: steps.reproduce.outcome != 'success'
        run: exit 1

      - name: Enforce RKF nuclear experiment execution
        if: steps.reproduce.outcome == 'success' && steps.nuclear.outcome != 'success'
        run: exit 1

      - name: Enforce scientific fingerprint result
        if: steps.reproduce.outcome == 'success' && steps.fingerprint.outcome != 'success'
        run: exit 1

      - name: Enforce publication bundle result
        if: steps.reproduce.outcome == 'success' && steps.bundle.outcome != 'success'
        run: exit 1

      - name: Enforce paper analysis result
        if: steps.reproduce.outcome == 'success' && steps.analysis.outcome != 'success'
        run: exit 1

      - name: Enforce baseline comparison result
        if: steps.reproduce.outcome == 'success' && steps.baselines.outcome != 'success'
        run: exit 1
