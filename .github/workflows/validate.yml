name: Validate publication package

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Run unit tests
        run: python -m unittest discover -s tests -v

      - name: Extract uploaded processed dataset
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p data/processed
          if [ -f uam_v4_processed_dataset.zip ]; then
            unzip -o uam_v4_processed_dataset.zip -d data/processed
          fi
          test -f data/processed/ame_nubase_atomic_native.csv

      - name: Verify dataset integrity
        run: |
          python scripts/verify_dataset.py \
            data/processed/ame_nubase_atomic_native.csv \
            --certificate releases/uam-v4/dataset_certificate.json

      - name: Reproduce frozen report and verify exact hash
        run: |
          python src/uam_v4_reproducer.py \
            --input data/processed/ame_nubase_atomic_native.csv \
            --output build/universal_atomic_guarded_two_axis_v4.json \
            --source-label data/processed/ame_nubase_atomic_native.csv \
            --expected-hash 34efc196e348d58fedf13d7491d20c069345606cd06393b5338a9dc12359edd7

      - name: Upload reproduction artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: uam-v4-reproduction
          path: |
            releases/uam-v4/dataset_certificate.json
            build/universal_atomic_guarded_two_axis_v4.json
          if-no-files-found: warn
