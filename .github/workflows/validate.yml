name: Validate publication package

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Run unit tests
        run: python -m unittest discover -s tests -v

      - name: Reproduce frozen UAM V4 release
        id: reproduce
        continue-on-error: true
        run: python scripts/reproduce_release.py

      - name: Upload reproduction artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: uam-v4-reproduction
          path: |
            releases/uam-v4/dataset_certificate.json
            releases/uam-v4/universal_atomic_guarded_two_axis_v4.json
            releases/uam-v4/reproduction_certificate.json
          if-no-files-found: warn

      - name: Commit reproduction artifacts or diagnostics
        if: always() && github.event_name == 'push' && github.ref == 'refs/heads/main'
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          for path in \
            releases/uam-v4/dataset_certificate.json \
            releases/uam-v4/universal_atomic_guarded_two_axis_v4.json \
            releases/uam-v4/reproduction_certificate.json; do
            if [ -f "$path" ]; then
              git add "$path"
            fi
          done
          if git diff --cached --quiet; then
            echo "No reproduction artifact changes to commit."
          else
            git commit -m "Record UAM V4 reproduction result [skip ci]"
            git push
          fi

      - name: Enforce reproduction result
        if: steps.reproduce.outcome != 'success'
        run: exit 1
