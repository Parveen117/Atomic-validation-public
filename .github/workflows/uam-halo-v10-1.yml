name: UAM Halo V10.1

on:
  workflow_dispatch:
  pull_request:
    paths:
      - "release/uam_halo_v10_1/**"
      - ".github/workflows/uam-halo-v10-1.yml"
  push:
    branches:
      - "agent/uam-halo-v10-1-public-release"
    paths:
      - "release/uam_halo_v10_1/**"
      - ".github/workflows/uam-halo-v10-1.yml"

permissions:
  contents: read

jobs:
  validate-public-release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Compile public halo package
        run: python -m compileall -q release/uam_halo_v10_1/src release/uam_halo_v10_1/reproduce.py

      - name: Run public halo regression tests
        run: python -m unittest discover -s release/uam_halo_v10_1/tests -p "test_*.py" -v

      - name: Validate configuration, annotations, report, and certificate
        run: |
          python - <<'PY'
          import hashlib
          import json
          from pathlib import Path

          root = Path("release/uam_halo_v10_1")
          config = json.loads((root / "config/default_config.json").read_text())
          annotations = json.loads((root / "data/manifests/halo_annotations.json").read_text())
          mapping = json.loads((root / "data/manifests/v4_input_mapping.json").read_text())
          report = json.loads((root / "reports/uam_halo_v10_1_report.json").read_text())
          certificate = json.loads((root / "reproduction_certificate.json").read_text())
          summary = json.loads((root / "reports/uam_halo_v10_1_public_result_summary.json").read_text())

          assert config["thresholds_keV"] == [500.0, 1000.0, 1500.0, 2000.0]
          assert config["controls_per_halo"] == 3
          assert config["reference_threshold_keV"] == 1000.0
          assert config["control_matching"]["halo_labels_enter_distance"] is False
          assert annotations["used_for_prediction"] is False
          assert annotations["used_for_control_distance"] is False
          assert len(annotations["halo_candidates"]) == len(set(annotations["halo_candidates"]))
          assert mapping["mapping_status"] == "CERTIFIED"
          assert mapping["expected_row_count"] == 3558

          assert report["rows_read"] == 3558
          assert report["rows_valid"] == 3558
          assert report["rows_rejected"] == 0
          assert report["report_hash"] == "ae50050f34068b10342c9a6f66a25847ff92b1c811ccd44adf930f17a7961021"
          assert summary["source_report_hash"] == report["report_hash"]
          assert summary["strict_v10_1_replication"]["candidates_exceeding_all_same_predictor_controls"] == 4

          certificate_text = (root / "reproduction_certificate.json").read_bytes()
          certificate_sha256 = hashlib.sha256(certificate_text).hexdigest()
          assert len(certificate_sha256) == 64

          print("public halo release validation passed")
          print("report hash:", report["report_hash"])
          print("certificate file sha256:", certificate_sha256)
          PY

      - name: Upload validated public artefacts
        uses: actions/upload-artifact@v4
        with:
          name: uam-halo-v10-1-validated-release
          path: |
            release/uam_halo_v10_1/reports/RESULTS.md
            release/uam_halo_v10_1/reports/uam_halo_v10_1_report.json
            release/uam_halo_v10_1/reports/uam_halo_v10_1_public_result_summary.json
            release/uam_halo_v10_1/reproduction_certificate.json
            release/uam_halo_v10_1/figures/halo_expanded_control_effects.png
          if-no-files-found: error
